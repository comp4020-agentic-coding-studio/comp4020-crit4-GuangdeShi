<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacBook Accordion (Plan C spike)</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="stage">
      <header class="masthead">
        <h1>MacBook Accordion</h1>
        <p class="tagline">Keys choose the note. The screen breathes.</p>
      </header>

      <div class="accordion" id="accordion" data-direction="rest">
        <div class="bellows-crown" aria-hidden="true">
          <div class="grille"></div>
          <div class="strap"></div>
          <div class="strap strap-right"></div>
        </div>

        <section class="bellows" id="bellows" aria-hidden="true">
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
        </section>

        <section class="manual">
          <div class="keyboard" id="keyboard">
            <div class="key-row black-row" id="black-row"></div>
            <div class="key-row white-row" id="white-row"></div>
          </div>
        </section>
      </div>

      <p id="sensor-status" class="sensor-status" data-state="connecting">Waiting for MacBook sensor…</p>
      <div class="telemetry" id="telemetry">
        <span>∠<span id="debug-angle">--</span></span>
        <span>ω<span id="debug-velocity">--</span></span>
        <span>♪<span id="debug-dynamic">--</span></span>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
