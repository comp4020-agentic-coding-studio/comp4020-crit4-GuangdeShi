<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacBook Accordion</title>
    <meta
      name="description"
      content="A live-synthesised accordion: physical/on-screen keys pick the note, the MacBook's own lid (or a dragged on-screen bellows on the public page) supplies the air."
    />
    <meta property="og:image" content="./card.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <nav aria-label="Primary"><a href="./">Home</a></nav>
    <main class="stage">
      <header class="masthead">
        <h1>MacBook Accordion</h1>
        <p class="tagline">Keys choose the note. The screen breathes.</p>
      </header>

      <div class="accordion" id="accordion" data-direction="rest">
        <div class="bellows-crown" aria-hidden="true">
          <div class="grille"></div>
          <div class="strap"></div>
          <div class="strap strap-right"></div>
        </div>

        <section class="bellows" id="bellows" aria-hidden="true">
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
          <div class="fold"></div>
        </section>

        <section class="manual">
          <div class="keyboard" id="keyboard">
            <div class="key-row black-row" id="black-row"></div>
            <div class="key-row white-row" id="white-row"></div>
          </div>
        </section>
      </div>

      <p id="mode-status" class="mode-status" data-state="connecting">DRAG BELLOWS — hold a key, drag the bellows.</p>
      <div class="telemetry" id="telemetry">
        <span>∠<span id="debug-angle">--</span></span>
        <span>ω<span id="debug-velocity">--</span></span>
        <span>♪<span id="debug-dynamic">--</span></span>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
