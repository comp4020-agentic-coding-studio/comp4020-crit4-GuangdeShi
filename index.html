<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bash Kit</title>
    <meta
      name="description"
      content="Bash Kit — a playable cartoon drum kit in your browser. Click, tap, or press a key to hit a drum; live Web Audio synthesis, no samples, no score."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>

    <!-- Shared gradients referenced by every drum's inline SVG below --
         one definition, not one per drum. -->
    <svg aria-hidden="true" focusable="false" class="visually-hidden" width="0" height="0">
      <defs>
        <radialGradient id="skinGradient" cx="35%" cy="28%" r="78%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#f2ede0" />
          <stop offset="100%" stop-color="#d8cfb8" />
        </radialGradient>
        <radialGradient id="cymbalGradient" cx="35%" cy="26%" r="80%">
          <stop offset="0%" stop-color="#fff4c2" />
          <stop offset="55%" stop-color="#e3b93f" />
          <stop offset="100%" stop-color="#8f6412" />
        </radialGradient>
      </defs>
    </svg>

    <main>
      <div class="hero">
        <h1 class="hero-title">Bash Kit</h1>
        <p class="hero-subtitle">Hit a drum. Build a beat.</p>
      </div>

      <div
        id="stage"
        aria-label="Bash Kit: a playable cartoon drum kit. Click, tap, or press the letter shown on each drum to hear it. Small dials near the kick, snare, and hi-hat set them looping at a shared tempo."
      >
        <!-- Crash (back left) -->
        <button
          type="button"
          class="drum drum--crash"
          data-drum="crash"
          data-key="L"
          style="left: 3%; top: 2%; width: 24%; z-index: 3"
          aria-label="Crash cymbal. Click or press L."
        >
          <svg viewBox="0 0 200 110" class="drum-fig" aria-hidden="true">
            <line x1="100" y1="60" x2="92" y2="120" stroke="#3a2a12" stroke-width="6" />
            <ellipse cx="100" cy="55" rx="94" ry="28" fill="url(#cymbalGradient)" stroke="#5c3d0a" stroke-width="2" />
            <ellipse cx="100" cy="55" rx="70" ry="20" fill="none" stroke="#5c3d0a" stroke-width="1.5" opacity="0.5" />
            <ellipse cx="100" cy="55" rx="44" ry="12" fill="none" stroke="#5c3d0a" stroke-width="1.5" opacity="0.5" />
            <path d="M30,42 A94,28 0 0 1 100,28" fill="none" stroke="#fff6da" stroke-width="3" opacity="0.6" />
            <rect class="key-badge" x="80" y="42" width="40" height="26" rx="8" />
            <text class="key-label" x="100" y="60" text-anchor="middle">L</text>
          </svg>
        </button>

        <!-- Ride (back right) -->
        <button
          type="button"
          class="drum drum--ride"
          data-drum="ride"
          data-key=";"
          style="left: 73%; top: 0%; width: 26%; z-index: 3"
          aria-label="Ride cymbal. Click or press semicolon."
        >
          <svg viewBox="0 0 200 110" class="drum-fig" aria-hidden="true">
            <line x1="100" y1="60" x2="108" y2="120" stroke="#3a2a12" stroke-width="6" />
            <ellipse cx="100" cy="55" rx="96" ry="27" fill="url(#cymbalGradient)" stroke="#5c3d0a" stroke-width="2" />
            <ellipse cx="100" cy="55" rx="72" ry="19" fill="none" stroke="#5c3d0a" stroke-width="1.5" opacity="0.5" />
            <ellipse cx="100" cy="47" rx="20" ry="9" fill="#caa54a" stroke="#5c3d0a" stroke-width="1.5" />
            <path d="M32,40 A96,27 0 0 1 100,26" fill="none" stroke="#fff6da" stroke-width="3" opacity="0.6" />
            <rect class="key-badge" x="79" y="72" width="42" height="26" rx="8" />
            <text class="key-label" x="100" y="90" text-anchor="middle">;</text>
          </svg>
        </button>

        <!-- High tom -->
        <button
          type="button"
          class="drum drum--tom-high"
          data-drum="tom-high"
          data-key="U"
          style="left: 32%; top: 6%; width: 17%; z-index: 4"
          aria-label="High tom. Click or press U."
        >
          <svg viewBox="0 0 200 160" class="drum-fig" aria-hidden="true">
            <path d="M14,78 A86,54 0 0 0 186,78 L186,112 A86,54 0 0 1 14,112 Z" fill="#8b5cf6" />
            <ellipse class="drum-head" cx="100" cy="78" rx="86" ry="54" fill="url(#skinGradient)" />
            <ellipse cx="100" cy="78" rx="86" ry="54" fill="none" stroke="#2b2118" stroke-width="4" opacity="0.3" />
            <circle class="impact-dot" cx="100" cy="78" r="16" fill="#ffffff" opacity="0" />
            <rect class="key-badge" x="78" y="64" width="44" height="30" rx="9" />
            <text class="key-label" x="100" y="86" text-anchor="middle">U</text>
          </svg>
        </button>

        <!-- Mid tom -->
        <button
          type="button"
          class="drum drum--tom-mid"
          data-drum="tom-mid"
          data-key="I"
          style="left: 50%; top: 8%; width: 19%; z-index: 4"
          aria-label="Mid tom. Click or press I."
        >
          <svg viewBox="0 0 200 160" class="drum-fig" aria-hidden="true">
            <path d="M14,78 A86,54 0 0 0 186,78 L186,112 A86,54 0 0 1 14,112 Z" fill="#3b82f6" />
            <ellipse class="drum-head" cx="100" cy="78" rx="86" ry="54" fill="url(#skinGradient)" />
            <ellipse cx="100" cy="78" rx="86" ry="54" fill="none" stroke="#2b2118" stroke-width="4" opacity="0.3" />
            <circle class="impact-dot" cx="100" cy="78" r="16" fill="#ffffff" opacity="0" />
            <rect class="key-badge" x="78" y="64" width="44" height="30" rx="9" />
            <text class="key-label" x="100" y="86" text-anchor="middle">I</text>
          </svg>
        </button>

        <!-- Hi-hat open (small, behind/above the closed pair) -->
        <button
          type="button"
          class="drum drum--hihat-open"
          data-drum="hihat-open"
          data-key="H"
          style="left: 3%; top: 32%; width: 15%; z-index: 5"
          aria-label="Open hi-hat. Click or press H."
        >
          <svg viewBox="0 0 200 130" class="drum-fig" aria-hidden="true">
            <line x1="100" y1="70" x2="100" y2="130" stroke="#3a3a3a" stroke-width="6" />
            <ellipse cx="100" cy="78" rx="88" ry="24" fill="url(#cymbalGradient)" stroke="#5c3d0a" stroke-width="2" />
            <ellipse cx="100" cy="46" rx="80" ry="21" fill="url(#cymbalGradient)" stroke="#5c3d0a" stroke-width="2" />
            <rect class="key-badge" x="80" y="94" width="40" height="26" rx="8" />
            <text class="key-label" x="100" y="112" text-anchor="middle">H</text>
          </svg>
        </button>

        <!-- Hi-hat closed (main target, front left) -->
        <button
          type="button"
          class="drum drum--hihat-closed"
          data-drum="hihat-closed"
          data-key="K"
          style="left: 2%; top: 46%; width: 21%; z-index: 7"
          aria-label="Closed hi-hat. Click or press K."
        >
          <svg viewBox="0 0 200 140" class="drum-fig" aria-hidden="true">
            <line x1="100" y1="60" x2="100" y2="130" stroke="#3a3a3a" stroke-width="7" />
            <path d="M60,130 L40,150 M100,130 L100,155 M140,130 L160,150" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round" />
            <ellipse cx="100" cy="66" rx="94" ry="26" fill="url(#cymbalGradient)" stroke="#5c3d0a" stroke-width="2" />
            <ellipse cx="100" cy="58" rx="90" ry="25" fill="url(#cymbalGradient)" stroke="#5c3d0a" stroke-width="2" opacity="0.95" />
            <rect class="key-badge" x="78" y="46" width="44" height="28" rx="9" />
            <text class="key-label" x="100" y="66" text-anchor="middle">K</text>
          </svg>
        </button>

        <!-- Snare (front, left of kick) -->
        <button
          type="button"
          class="drum drum--snare"
          data-drum="snare"
          data-key="J"
          style="left: 24%; top: 44%; width: 22%; z-index: 8"
          aria-label="Snare drum. Click or press J."
        >
          <svg viewBox="0 0 200 170" class="drum-fig" aria-hidden="true">
            <path d="M12,86 A88,56 0 0 0 188,86 L188,124 A88,56 0 0 1 12,124 Z" fill="#c9ccd1" />
            <line x1="30" y1="108" x2="170" y2="108" stroke="#8b8f96" stroke-width="2" opacity="0.7" />
            <line x1="30" y1="116" x2="170" y2="116" stroke="#8b8f96" stroke-width="2" opacity="0.7" />
            <rect x="178" y="90" width="14" height="20" rx="3" fill="#8b8f96" />
            <ellipse class="drum-head" cx="100" cy="86" rx="88" ry="56" fill="url(#skinGradient)" />
            <ellipse cx="100" cy="86" rx="88" ry="56" fill="none" stroke="#2b2118" stroke-width="4" opacity="0.3" />
            <circle class="impact-dot" cx="100" cy="86" r="17" fill="#ffffff" opacity="0" />
            <rect class="key-badge" x="76" y="70" width="48" height="32" rx="9" />
            <text class="key-label" x="100" y="94" text-anchor="middle">J</text>
          </svg>
        </button>

        <!-- Kick (front centre, dominant) -->
        <button
          type="button"
          class="drum drum--kick"
          data-drum="kick"
          data-key="Space,F"
          style="left: 44%; top: 40%; width: 36%; z-index: 9"
          aria-label="Kick drum. Click, press Space, or press F."
        >
          <svg viewBox="0 0 220 180" class="drum-fig" aria-hidden="true">
            <path d="M14,92 A96,62 0 0 0 206,92 L206,132 A96,62 0 0 1 14,132 Z" fill="#e2483c" />
            <ellipse class="drum-head" cx="110" cy="92" rx="96" ry="62" fill="url(#skinGradient)" />
            <ellipse cx="110" cy="92" rx="96" ry="62" fill="none" stroke="#2b2118" stroke-width="5" opacity="0.3" />
            <circle cx="45" cy="122" r="15" fill="#e2483c" opacity="0.85" />
            <circle class="impact-dot" cx="110" cy="92" r="20" fill="#ffffff" opacity="0" />
            <rect class="key-badge key-badge--wide" x="70" y="76" width="80" height="32" rx="10" />
            <text class="key-label" x="110" y="100" text-anchor="middle">SPACE</text>
          </svg>
        </button>

        <!-- Floor tom (front right, standing on legs) -->
        <button
          type="button"
          class="drum drum--tom-floor"
          data-drum="tom-floor"
          data-key="O"
          style="left: 78%; top: 44%; width: 24%; z-index: 8"
          aria-label="Floor tom. Click or press O."
        >
          <svg viewBox="0 0 200 190" class="drum-fig" aria-hidden="true">
            <path d="M50,150 L34,186 M100,150 L100,188 M150,150 L166,186" stroke="#0f766e" stroke-width="7" stroke-linecap="round" />
            <path d="M10,84 A90,58 0 0 0 190,84 L190,150 A90,58 0 0 1 10,150 Z" fill="#14b8a6" />
            <ellipse class="drum-head" cx="100" cy="84" rx="90" ry="58" fill="url(#skinGradient)" />
            <ellipse cx="100" cy="84" rx="90" ry="58" fill="none" stroke="#2b2118" stroke-width="4" opacity="0.3" />
            <circle class="impact-dot" cx="100" cy="84" r="18" fill="#ffffff" opacity="0" />
            <rect class="key-badge" x="78" y="68" width="44" height="30" rx="9" />
            <text class="key-label" x="100" y="90" text-anchor="middle">O</text>
          </svg>
        </button>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
